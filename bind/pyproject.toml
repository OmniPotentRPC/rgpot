[build-system]
requires = ["scikit-build-core>=1.1", "nanobind>=3.1", "numpy>=1.24"]
build-backend = "scikit_build_core.build"

[project]
name = "rgbind-tests"
version = "1.0.0"
description = "Test module for the rgbind nanobind policy header."
readme = { file = "README.org", content-type = "text/plain" }
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Rohit Goswami", email = "rgoswami@ieee.org" }]
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
test = [
  "pytest>=7",
  "pytest-run-parallel>=0.4",
  "pytest-timeout>=2",
  "hypothesis>=6",
  "numpy>=1.24",
]

[tool.scikit-build]
minimum-version = "0.10"
cmake.version = ">=3.15"
wheel.py-api = "cp312"
build.verbose = false
wheel.packages = []

[tool.cibuildwheel]
build = "cp310-* cp311-* cp312-* cp314t-* cp315t-*"
skip = ["pp*", "*-musllinux*", "*_i686", "*-win32"]
manylinux-x86_64-image = "manylinux_2_28"
manylinux-aarch64-image = "manylinux_2_28"
test-requires = ["pytest", "numpy", "hypothesis"]
test-command = "python ci/check_f1.py && python -m pytest -q tests"
test-sources = ["tests", "ci", "examples"]

[tool.cibuildwheel.macos]
archs = ["arm64"]
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.mypy]
mypy_path = "tests"
strict = true
python_version = "3.10"

[[tool.mypy.overrides]]
module = "_rgbind_test"
disallow_any_generics = false

[tool.pyright]
include = ["examples"]
extraPaths = ["tests"]
typeCheckingMode = "standard"
pythonVersion = "3.10"
reportMissingModuleSource = "none"
