# Git hooks via `prek` (https://prek.j178.dev) — Rust drop-in for pre-commit.
# Install locally: `prek install`  (or `pixi r prek-install`)
# Run all hooks:   `prek run -a`   (or `pixi r prek`)
#:schema https://www.schemastore.org/prek.json

minimum_prek_version = "0.3.0"

exclude = """(?x)(
    ^\\.pixi/|
    ^docs/build/|
    ^docs/doctrees/|
    ^rgpot-core/target/|
    ^subprojects/(?!.*\\.wrap$)|
    ^CppCore/tests/data/|
    ^third_party/libxckernel/
)"""

# Fast native implementations (no clone / no Python env).
[[repos]]
repo = "builtin"
hooks = [
  { id = "trailing-whitespace", exclude = "^(src)" },
  { id = "end-of-file-fixer" },
  { id = "check-yaml" },
  { id = "check-toml" },
  { id = "check-merge-conflict" },
  { id = "check-added-large-files", args = ["--maxkb=1000"] },
  { id = "detect-private-key" },
]

# clang-format / cmake-format are intentionally not in prek: CI and local
# clang-format minor versions diverge (v16 vs v19/22) and always rewrite the
# same files. Run explicitly when preparing a release commit:
#   find CppCore -name '*.cc' -o -name '*.hpp' | xargs clang-format-16 -i
#   cmake-format -i CMakeLists.txt

# Project-local tools (must be on PATH in the pixi / CI environment).
[[repos]]
repo = "local"
hooks = [
  {
    id = "cppcheck",
    name = "cppcheck",
    entry = "cppcheck",
    language = "system",
    types_or = ["c++", "c"],
    args = ["--error-exitcode=0"],
  },
  {
    id = "meson-format",
    name = "meson format",
    entry = "meson",
    language = "system",
    types = ["meson"],
    files = 'meson\.build$',
    args = ["format", "-i"],
  },
  {
    id = "nickel-format",
    name = "nickel format",
    entry = "pixi",
    language = "system",
    files = '\.ncl$',
    args = ["r", "-e", "cigen", "nickel", "format"],
  },
  # Generated GHA must match ci/gha/*.ncl; edit Nickel only, never hand-edit YAML.
  {
    id = "gha-nickel-drift",
    name = "GHA Nickel drift (gen-gha + diff)",
    entry = "pixi",
    language = "system",
    pass_filenames = false,
    files = '^(ci/gha/.*\\.ncl|\\.github/workflows/.*\\.yml)$',
    args = ["r", "-e", "cigen", "gha-drift"],
  },
  {
    id = "snapper",
    name = "snapper semantic line breaks (org docs)",
    # Prefer `snapper`; fall back to `snapper-fmt` (release asset name).
    entry = "bash",
    language = "system",
    files = '^docs/orgmode/.*\.org$',
    args = [
      "-c",
      "S=$(command -v snapper || command -v snapper-fmt); exec \"$S\" --in-place --config .snapper.toml --format org \"$@\"",
      "--",
    ],
  },
  # Ensure towncrier config stays parseable; fragment enforcement is PR CI
  # (release-prepare / dedicated job), not every local commit.
  {
    id = "towncrier-config",
    name = "towncrier config present",
    entry = "bash",
    language = "system",
    pass_filenames = false,
    always_run = false,
    files = '^(towncrier\\.toml|docs/newsfragments/)',
    args = ["-c", "test -f towncrier.toml && test -d docs/newsfragments"],
  },
]
