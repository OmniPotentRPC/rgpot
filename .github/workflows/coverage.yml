# Multi-language coverage for Codecov (rust / cpp / python / fortran).
#
# Live dashboard: https://app.codecov.io/gh/OmniPotentRPC/rgpot
#
# Auth: Codecov GitHub App OIDC (use_oidc: true). Optional CODECOV_TOKEN for
# accounts that still use upload tokens. fail_ci_if_error: false soft-fails
# upload so generation still greens the job.

name: Coverage

on:
  push:
    branches: [main, ci/coverage]
  pull_request:
  workflow_dispatch:

concurrency:
  group: coverage-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  PIXi_VERSION: v0.70.2

jobs:
  coverage-rust:
    runs-on: ubuntu-22.04
    name: rust coverage
    strategy:
      matrix:
        llvm-version: [20]
    env:
      CC: clang-${{ matrix.llvm-version }}
      CXX: clang++-${{ matrix.llvm-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup LLVM
        run: |
          wget https://apt.llvm.org/llvm.sh
          chmod +x llvm.sh
          sudo ./llvm.sh ${{ matrix.llvm-version }}
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y clang-${{ matrix.llvm-version }}

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable
        with:
          toolchain: stable
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@db3874b116727aa105fa89413c3552b9346f8cc9 # cargo-llvm-cov
        with:
          tool: cargo-llvm-cov

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXi_VERSION }}
          cache: true
          environments: devbld
          activate-environment: true

      - name: Structural Codecov config gate
        run: bash scripts/check_codecov_config.sh

      - name: Generate rust coverage
        run: |
          unset RUSTC_WRAPPER || true
          # capnp for --all-features rpc
          bash scripts/run_coverage_rust.sh lcov.info rust_codecov.json
          test -s lcov.info

      - name: Upload rust coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-rust
          path: |
            lcov.info
            rust_codecov.json
          if-no-files-found: error

  coverage-cpp:
    runs-on: ubuntu-22.04
    name: cpp coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive

      - name: Install lcov + gfortran
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends lcov gfortran

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXi_VERSION }}
          cache: true
          environments: devbld
          activate-environment: true

      - name: Generate C++ (Meson) coverage
        env:
          RGPOT_COV_BUILDDIR: bbdir-cov
        run: |
          bash scripts/run_coverage_cpp.sh cpp_lcov.info
          test -s cpp_lcov.info
          # Fortran kernel hits from the same tree (the pot tests drive them)
          bash scripts/run_coverage_fortran.sh fortran_lcov.info
          test -s fortran_lcov.info
          ls -la cpp_lcov.info fortran_lcov.info

      - name: Upload cpp coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-cpp
          path: |
            cpp_lcov.info
            fortran_lcov.info
          if-no-files-found: error

  coverage-python:
    runs-on: ubuntu-22.04
    name: python coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXi_VERSION }}
          cache: true
          environments: rpctest
          activate-environment: true

      - name: Generate python coverage
        run: |
          bash scripts/run_coverage_python.sh python_coverage.xml
          test -s python_coverage.xml
          head -c 400 python_coverage.xml; echo

      - name: Upload python coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-python
          path: python_coverage.xml
          if-no-files-found: error

  # Dedicated fortran path when the cpp job skipped the kernels; no-op if already uploaded.
  coverage-fortran:
    runs-on: ubuntu-22.04
    name: fortran coverage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install gfortran + lcov
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gfortran lcov

      - uses: prefix-dev/setup-pixi@d3f436a425481402e6a95a1d1fc10331c708cd9e # v0.10.2
        with:
          pixi-version: ${{ env.PIXi_VERSION }}
          cache: true
          environments: devbld
          activate-environment: true

      - name: Generate Fortran kernel coverage
        env:
          RGPOT_COV_BUILDDIR: bbdir-cov
        run: |
          # The meson tree is required: the kernels build inside it.
          if [[ ! -d bbdir-cov ]]; then
            bash scripts/run_coverage_cpp.sh /tmp/cpp_for_fort.info
          fi
          bash scripts/run_coverage_fortran.sh fortran_lcov.info
          test -s fortran_lcov.info
          grep -E '^(SF:|DA:)' fortran_lcov.info | head -15

      - name: Upload fortran coverage artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-fortran
          path: fortran_lcov.info
          if-no-files-found: error

  # Upload runs only on push to main: the OIDC token (id-token: write) exists in
  # no other job, and pull_request runs stay read-only.
  codecov-upload:
    runs-on: ubuntu-22.04
    name: codecov upload
    needs: [coverage-rust, coverage-cpp, coverage-python, coverage-fortran]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: cov

      - name: Upload rust coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-rust/lcov.info,cov/coverage-rust/rust_codecov.json
          flags: rust
          name: rgpot-rust
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload cpp coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-cpp/cpp_lcov.info
          flags: cpp
          name: rgpot-cpp
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload python coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-python/python_coverage.xml
          flags: python
          name: rgpot-python
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true

      - name: Upload fortran coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          files: cov/coverage-fortran/fortran_lcov.info
          flags: fortran
          name: rgpot-fortran
          use_oidc: true
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false
          verbose: true
