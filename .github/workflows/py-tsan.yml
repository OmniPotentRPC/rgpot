name: Python TSan

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory that contains the project to install
        required: true
        type: string
      import-names:
        description: Comma-separated extension modules
        required: true
        type: string
      test-path:
        description: Pytest path relative to package-dir
        required: true
        type: string
      extras:
        description: Extras to install with the package
        required: false
        type: string
        default: ""
      rust-crate-dir:
        description: Crate directory relative to package-dir. Empty means no Rust sanitizer build.
        required: false
        type: string
        default: ""
      rust-archive:
        description: Rust staticlib file name counted for __tsan_func_entry when rust-crate-dir is set.
        required: false
        type: string
        default: librust_core_demo.a
      tsan-cmake-args:
        description: CMake arguments for the TSan build. Empty by default.
        required: false
        type: string
        default: ""
      rust-toolchain:
        description: Rustup toolchain installed when rust-crate-dir is set.
        required: false
        type: string
        default: nightly-2026-01-20
      apt-packages:
        description: Space-separated apt packages installed inside the TSan image. Empty skips apt.
        required: false
        type: string
        default: ""
      setup-script:
        description: Repo-relative script to source instead of pip install of the package. Empty keeps pip install.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  tsan:
    name: T2 cpython_sanity 3.14t
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Lower vm.mmap_rnd_bits when TSan requires it
        shell: bash
        run: |
          set -euo pipefail
          bits="$(cat /proc/sys/vm/mmap_rnd_bits || echo 28)"
          echo "vm.mmap_rnd_bits=${bits}"
          if [ "${bits}" -gt 28 ]; then
            sudo sysctl vm.mmap_rnd_bits=28
          fi

      - name: Pytest under ThreadSanitizer
        shell: bash
        env:
          PKG: ${{ inputs.package-dir }}
          TEST_PATH: ${{ inputs.test-path }}
          IMPORTS: ${{ inputs.import-names }}
          EXTRAS: ${{ inputs.extras }}
          RUST_CRATE: ${{ inputs.rust-crate-dir }}
          RUST_ARCHIVE: ${{ inputs.rust-archive }}
          TSAN_CMAKE_ARGS: ${{ inputs.tsan-cmake-args }}
          RUST_TOOLCHAIN: ${{ inputs.rust-toolchain }}
          APT_PACKAGES: ${{ inputs.apt-packages }}
          SETUP_SCRIPT: ${{ inputs.setup-script }}
        run: |
          set -euo pipefail
          # numpy-tsan is the cpython_sanity 3.14t image plus a TSan numpy.
          # The tag is pinned by digest. Mount the tree at /src. /work holds
          # the image's pyenv install.
          IMAGE=ghcr.io/nascheme/numpy-tsan:3.14t@sha256:f6dd658f1a155be35e27b182cac97c2a77c4b2d62bacb81753beaba725978149
          docker run --rm -i \
            -e PKG -e TEST_PATH -e IMPORTS -e EXTRAS -e RUST_CRATE -e RUST_ARCHIVE -e TSAN_CMAKE_ARGS -e RUST_TOOLCHAIN \
            -e APT_PACKAGES -e SETUP_SCRIPT \
            -v "$GITHUB_WORKSPACE":/src -w /src \
            "$IMAGE" \
            bash -s << 'EOF'
          set -euo pipefail
          if command -v python >/dev/null 2>&1; then
            PY=python
          elif command -v python3 >/dev/null 2>&1; then
            PY=python3
          else
            echo "python not on PATH" >&2
            exit 1
          fi
          "$PY" -c 'import sys; print(sys.version); print("gil", sys._is_gil_enabled())'
          if ! command -v "${CXX:-clang++}" >/dev/null 2>&1 && ! command -v clang++ >/dev/null 2>&1; then
            apt-get update
            apt-get install -y clang
          fi
          if ! command -v curl >/dev/null 2>&1; then
            apt-get update
            apt-get install -y ca-certificates curl
          fi
          export CC="${CC:-clang}"
          export CXX="${CXX:-clang++}"
          export CFLAGS="${CFLAGS:-} -fsanitize=thread -fno-omit-frame-pointer -g -ffp-contract=off"
          export CXXFLAGS="${CXXFLAGS:-} -fsanitize=thread -fno-omit-frame-pointer -g -ffp-contract=off"
          export LDFLAGS="${LDFLAGS:-} -fsanitize=thread"
          export PIP_BREAK_SYSTEM_PACKAGES=1
          if [ -n "${APT_PACKAGES}" ]; then
            apt-get update
            # shellcheck disable=SC2086
            apt-get install -y ${APT_PACKAGES}
          fi
          if [ -n "${RUST_CRATE}" ]; then
            if [ ! -f "/src/${PKG}/${RUST_CRATE}/Cargo.toml" ]; then
              echo "missing Rust crate /src/${PKG}/${RUST_CRATE}/Cargo.toml" >&2
              exit 1
            fi
            if ! command -v git >/dev/null 2>&1; then
              apt-get update
              apt-get install -y git ca-certificates
            fi
            # LLVM 21 nightly. rustc moved to LLVM 22 on 2026-01-28, and the
            # image clang is LLVM 21. The dated toolchain keeps the majors equal.
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain none --profile minimal
            # shellcheck disable=SC1091
            source "${HOME}/.cargo/env"
            rustup toolchain install "${RUST_TOOLCHAIN}" --component rust-src --profile minimal
            rustup default "${RUST_TOOLCHAIN}"
            cxx="${CXX}"
            clang_major="$("$cxx" -dM -E -x c /dev/null | awk '/^#define __clang_major__ / { print $3 }')"
            rust_major="$(rustc -vV | awk '/^LLVM version:/ { split($3, a, "."); print a[1] }')"
            echo "clang version: $("$cxx" --version | head -n 1)"
            echo "rustc version: $(rustc -vV | awk '/^rustc / { print; exit }')"
            echo "clang LLVM major ${clang_major}"
            echo "rustc LLVM major ${rust_major}"
            if [ -z "${clang_major}" ] || [ -z "${rust_major}" ] || [ "${clang_major}" != "${rust_major}" ]; then
              echo "clang and rustc LLVM majors differ" >&2
              exit 1
            fi
          fi
          "$PY" -m pip install -U pip
          "$PY" -m pip install nanobind scikit-build-core cmake ninja pytest pytest-timeout pytest-run-parallel hypothesis
          if ! "$PY" -c 'import numpy' >/dev/null 2>&1; then
            "$PY" -m pip install 'numpy>=1.24'
          fi
          spec="/src/${PKG}"
          cmake_args="${TSAN_CMAKE_ARGS}"
          install_args=(--no-build-isolation --no-deps)
          if [ -n "${RUST_CRATE}" ]; then
            if [ -n "${cmake_args}" ]; then
              cmake_args="${cmake_args} -DRust_TOOLCHAIN=${RUST_TOOLCHAIN}"
            else
              cmake_args="-DRust_TOOLCHAIN=${RUST_TOOLCHAIN}"
            fi
            install_args+=(--config-settings=build-dir=/tmp/rust-tsan-build)
          fi
          if [ -n "${cmake_args}" ]; then
            export CMAKE_ARGS="${cmake_args}"
          fi
          if [ -n "${SETUP_SCRIPT}" ]; then
            export ROOT=/src
            # shellcheck disable=SC1090
            source "/src/${SETUP_SCRIPT}"
          else
            "$PY" -m pip install "${install_args[@]}" "${spec}"
          fi
          if [ -n "${RUST_CRATE}" ]; then
            if ! command -v nm >/dev/null 2>&1; then
              apt-get update
              apt-get install -y binutils
            fi
            found=0
            total=0
            if [ -z "${RUST_ARCHIVE}" ]; then
              echo "rust-archive is empty" >&2
              exit 1
            fi
            echo "Rust staticlib name ${RUST_ARCHIVE}"
            while IFS= read -r archive; do
              [ -n "${archive}" ] || continue
              found=1
              count="$(nm -A "${archive}" | grep -c __tsan_func_entry || true)"
              echo "__tsan_func_entry count ${count} in ${archive}"
              total=$((total + count))
            done < <(find /tmp/rust-tsan-build -name "${RUST_ARCHIVE}" -type f)
            if [ "${found}" -eq 0 ]; then
              echo "${RUST_ARCHIVE} not found under /tmp/rust-tsan-build" >&2
              find /tmp/rust-tsan-build -name '*.a' -type f >&2 || true
              exit 1
            fi
            if [ "${total}" -eq 0 ]; then
              echo "Rust staticlib has no __tsan_func_entry" >&2
              exit 1
            fi
          fi
          SUP=/tmp/suppressions_free_threading.txt
          curl -fsSL -o "${SUP}" \
            https://raw.githubusercontent.com/python/cpython/bf397e272c2bee639c3ba0208c221f7dd9447bb6/Tools/tsan/suppressions_free_threading.txt
          if [ -f /work/tsan_suppressions/numpy.txt ]; then
            cat /work/tsan_suppressions/numpy.txt >> "${SUP}"
          fi
          # Upstream suppressions, pinned to a commit rather than the 3.14 branch:
          # https://github.com/python/cpython/blob/bf397e272c2bee639c3ba0208c221f7dd9447bb6/Tools/tsan/suppressions_free_threading.txt
          # https://github.com/numpy/numpy/blob/main/tools/ci/tsan_suppressions.txt
          export TSAN_OPTIONS="halt_on_error=1 allocator_may_return_null=1 suppressions=${SUP}"
          "$PY" -m pytest -s "/src/${PKG}/${TEST_PATH}" \
            --timeout=180 \
            -o faulthandler_timeout=120
          "$PY" -m pytest -s "/src/${PKG}/${TEST_PATH}" \
            --parallel-threads=4 \
            --iterations=5 \
            --timeout=180 \
            -o faulthandler_timeout=120
          EOF
