name: Wheels

# rgpot had no wheel workflow: 2.5.4 reached PyPI hand-built from a branch,
# with no tag and no main-branch source behind it. Tag-driven builds keep the
# artifact and the tag describing each other.
concurrency:
  group: wheels-${{ github.ref }}
  cancel-in-progress: true

on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the built artifacts"
        type: boolean
        default: false
      target:
        description: "Index to publish to (rehearse on TestPyPI first)"
        type: choice
        options:
          - testpypi
          - pypi
        default: testpypi
  push:
    tags:
      - "v*"
  pull_request:
    paths:
      - "pyproject.toml"
      - "meson.build"
      - "CppCore/**"
      - "python/**"
      - "subprojects/*.wrap"
      - "third_party/lepton/**"
      - "third_party/libxckernel/**"
      - ".github/workflows/wheels.yml"

jobs:
  wheels-linux:
    name: wheel (ubuntu-latest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.2.1
      - name: The kernels must be in the artifact, not just in the flags
        shell: bash
        run: |
          set -euo pipefail
          for whl in wheelhouse/*.whl; do
            echo "== ${whl}"
            rm -rf _whlx && mkdir _whlx && unzip -qo "${whl}" -d _whlx
            lib=$(find _whlx -name 'librgpot*' | head -1)
            test -n "${lib}" || { echo "no librgpot in wheel" >&2; exit 1; }
            n=$(nm "${lib}" 2>/dev/null \
              | grep -cE 'rgpot_(sw|edip|lenosky|tersoff|eam_al|fehe|cuh2|water_h)_force' || true)
            echo "   bind(c) kernel entries: ${n}"
            if [ "${n}" -lt 8 ]; then
              echo "wheel carries ${n}/8 Fortran kernels; -Dwith_fortran_pots lost" >&2
              exit 1
            fi
            # File, not echo|grep -q: wrap symbols make nm -C huge and
            # pipefail treats grep -q's early close as a missing symbol.
            nm -C "${lib}" > _syms 2>/dev/null || nm "${lib}" > _syms
            grep -q 'rgpot::ExprPot' _syms \
              || { echo "wheel missing ExprPot; -Dwith_expr lost" >&2; exit 1; }
            grep -q 'rgpot::D3Pot' _syms \
              || { echo "wheel missing D3Pot; -Dwith_dftd3 lost" >&2; exit 1; }
            grep -q 'rgpot::D4Pot' _syms \
              || { echo "wheel missing D4Pot; -Dwith_dftd4 lost" >&2; exit 1; }
            grep -q 'rgpot::XcKernel' _syms \
              || { echo "wheel missing XcKernel; -Dwith_xckernel lost" >&2; exit 1; }
            core=$(find _whlx -name '_core*.so' | head -1)
            test -n "${core}" || { echo "no _core in wheel" >&2; exit 1; }
            if grep -q 'libtorch' < <(readelf -d "${core}"); then
              echo "_core NEEDs libtorch; pip import would require torch" >&2
              readelf -d "${core}"
              exit 1
            fi
          done
      - uses: actions/upload-artifact@v7
        with:
          name: wheels-ubuntu-latest
          path: wheelhouse/*.whl

  wheels-macos:
    name: wheel (macos-14)
    runs-on: macos-14
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7
      - uses: pypa/cibuildwheel@v4.2.1
      - uses: actions/upload-artifact@v7
        if: success()
        with:
          name: wheels-macos-14
          path: wheelhouse/*.whl

  sdist:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      # meson-python runs setup for the sdist; -Dwith_dftd4 pulls the
      # wrap, which needs gfortran and OpenBLAS (lapack=openblas).
      - name: OpenBLAS for the dftd4 wrap
        run: sudo apt-get update && sudo apt-get install -y gfortran libopenblas-dev pkg-config
      - name: Build sdist
        run: pipx run build --sdist
      - name: Check
        run: pipx run twine check dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: sdist
          path: dist/*.tar.gz

  publish:
    needs: [wheels-linux, sdist]
    if: >-
      github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
      || (github.event_name == 'workflow_dispatch' && inputs.publish)
    runs-on: ubuntu-latest
    environment:
      name: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'testpypi-rgpot' || 'pypi-rgpot' }}
      url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/p/rgpot' || 'https://pypi.org/p/rgpot' }}
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Collect
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp -v {} upload/ \;
          ls -la upload/
      # OIDC trusted publisher is not registered for this project
      # (invalid-publisher on pypi-rgpot / testpypi-rgpot). Use the
      # environment PYPI_TOKEN until that publisher exists; keep
      # id-token: write so a later OIDC switch is one-line.
      - name: Publish
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          user: __token__
          password: ${{ secrets.PYPI_TOKEN }}
          packages-dir: upload/
          repository-url: ${{ (github.event_name == 'workflow_dispatch' && inputs.target == 'testpypi') && 'https://test.pypi.org/legacy/' || '' }}
          skip-existing: true
          verbose: true
