name: ISA audit

# Reusable static ISA gate. Callers upload an unstripped artefact and pass
# an allowlist path in their own repository:
#
#   jobs:
#     audit:
#       needs: build
#       permissions:
#         contents: read
#       uses: OmniPotentRPC/rgpot/.github/workflows/isa-audit.yml@<commit-sha>
#       with:
#         artifact-name: unstripped-libs
#         allow-file: isa-allow.toml
#         baseline: x86-64
#
# The script is taken from this workflow's commit (job.workflow_sha).
# The allowlist is taken from the caller checkout.

on:
  workflow_call:
    inputs:
      artifact-name:
        description: Uploaded artefact from the caller build job
        required: true
        type: string
      allow-file:
        description: Allowlist path in the caller repository
        required: true
        type: string
      baseline:
        description: x86-64, x86-64-v2, or armv8-a. Empty uses the per-file default.
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  audit:
    name: isa audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout caller
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          path: caller

      - name: Checkout auditor
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          persist-credentials: false
          path: auditor

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.12"

      - name: Install pinned auditor
        run: python -m pip install -r auditor/ci/isa-audit/requirements.txt

      - name: CPU flags
        run: |
          grep -m1 flags /proc/cpuinfo || true
          lscpu || true

      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ inputs.artifact-name }}
          path: isa-audit-input

      - name: Audit
        shell: bash
        env:
          ALLOW_FILE: ${{ inputs.allow-file }}
          BASELINE: ${{ inputs.baseline }}
        run: |
          set -euo pipefail
          args=(isa-audit-input --allow "caller/${ALLOW_FILE}" --json isa-audit-report.json)
          if [[ -n "${BASELINE}" ]]; then
            args+=(--baseline "${BASELINE}")
          fi
          python auditor/ci/isa-audit/isa_audit.py "${args[@]}" | tee isa-audit-report.txt

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: isa-audit-report-${{ inputs.artifact-name }}
          path: |
            isa-audit-report.json
            isa-audit-report.txt
