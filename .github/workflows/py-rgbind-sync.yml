name: rgbind header sync

on:
  workflow_call:
    inputs:
      vendored-path:
        description: Path to the vendored rgbind.hpp, relative to the repository root
        required: true
        type: string
      rgpot-ref:
        description: OmniPotentRPC/rgpot commit or ref that owns bind/include/rgbind/rgbind.hpp
        required: true
        type: string

permissions:
  contents: read

jobs:
  sync:
    name: vendored header matches rgpot
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Fail on any byte difference
        shell: bash
        env:
          VENDORED: ${{ inputs.vendored-path }}
          RGPOT_REF: ${{ inputs.rgpot-ref }}
        run: |
          set -euo pipefail
          test -f "${VENDORED}"
          curl -fsSL -o /tmp/rgbind.hpp \
            "https://raw.githubusercontent.com/OmniPotentRPC/rgpot/${RGPOT_REF}/bind/include/rgbind/rgbind.hpp"
          if cmp -s "${VENDORED}" /tmp/rgbind.hpp; then
            echo "rgbind.hpp matches ${RGPOT_REF}"
            exit 0
          fi
          diff -u "${VENDORED}" /tmp/rgbind.hpp || true
          echo "vendored rgbind.hpp differs from ${RGPOT_REF}" >&2
          exit 1
