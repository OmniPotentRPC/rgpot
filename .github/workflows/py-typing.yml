name: Python typing

on:
  workflow_call:
    inputs:
      package-dir:
        description: Directory that contains the project to install
        required: true
        type: string
      import-names:
        description: Comma-separated extension modules whose stubs are checked
        required: true
        type: string
      test-path:
        description: Directory of the committed stubs, relative to package-dir
        required: true
        type: string
      extras:
        description: Extras to install with the package
        required: false
        type: string
        default: ""

permissions:
  contents: read

jobs:
  typing:
    name: stubs, mypy, pyright
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"

      - name: Install the package and the type checkers
        shell: bash
        run: |
          set -euo pipefail
          python -m pip install -U pip
          python -m pip install 'nanobind==3.1.0' mypy pyright numpy
          if [ -n "${{ inputs.extras }}" ]; then
            python -m pip install "./${{ inputs.package-dir }}[${{ inputs.extras }}]"
          else
            python -m pip install "./${{ inputs.package-dir }}"
          fi

      - name: Regenerated stubs match the committed files
        shell: bash
        run: |
          set -euo pipefail
          for name in ${IMPORTS//,/ }; do
            python -m nanobind.stubgen -m "${name}" -o "/tmp/${name}.pyi"
            diff -u "${PKG}/${TEST_PATH}/${name}.pyi" "/tmp/${name}.pyi"
          done
          if [ -f "${PKG}/${TEST_PATH}/py.typed" ] || [ -f "${PKG}/py.typed" ]; then
            echo "py.typed present"
          else
            echo "py.typed missing" >&2
            exit 1
          fi
        env:
          PKG: ${{ inputs.package-dir }}
          TEST_PATH: ${{ inputs.test-path }}
          IMPORTS: ${{ inputs.import-names }}

      - name: mypy --strict and pyright
        shell: bash
        working-directory: ${{ inputs.package-dir }}
        run: |
          set -euo pipefail
          if [ -d examples ]; then
            python -m mypy --strict examples
            pyright examples
          else
            echo "no examples/ directory under package-dir"
          fi
