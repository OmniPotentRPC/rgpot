# MinGW-w64 (Debian/Ubuntu posix-thread toolchain) cross build. Tests run
# under wine. Used by ci/gha/mingw_wine_build.sh.
[binaries]
c = 'x86_64-w64-mingw32-gcc-posix'
cpp = 'x86_64-w64-mingw32-g++-posix'
fortran = 'x86_64-w64-mingw32-gfortran-posix'
ar = 'x86_64-w64-mingw32-ar'
strip = 'x86_64-w64-mingw32-strip'
windres = 'x86_64-w64-mingw32-windres'
nm = 'x86_64-w64-mingw32-nm'
cmake = 'cmake'
exe_wrapper = 'wine'

[properties]
needs_exe_wrapper = true
rust_target = 'x86_64-pc-windows-gnu'

[host_machine]
system = 'windows'
cpu_family = 'x86_64'
cpu = 'x86_64'
endian = 'little'

[built-in options]
# C++20 objects carry their own std::string members, which libstdc++.dll.a
# also exports. When an archive member that holds such a copy is pulled in
# only after the import has resolved the name, ld reports a multiple
# definition of what is the same code, so the first definition is kept.
cpp_link_args = ['-lquadmath', '-Wl,--allow-multiple-definition']
c_link_args = ['-lquadmath']
fortran_link_args = ['-lquadmath']

[cmake]
CMAKE_SYSTEM_NAME = 'Windows'
