[built-in options]
# GCC's null and nonnull checks make the soversion static_asserts non-constant.
# The rest of -fsanitize=undefined stays enabled.
c_args = ['-ffp-contract=off', '-fno-sanitize=null,nonnull-attribute,returns-nonnull-attribute']
cpp_args = ['-ffp-contract=off', '-fno-sanitize=null,nonnull-attribute,returns-nonnull-attribute']
