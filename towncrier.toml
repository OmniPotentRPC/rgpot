[tool.towncrier]
name = "rgpot"
# [[[cog import rgpot_version as v; cog.outl(f'version = "{v.VERSION}"')]]]
version = "3.6.0"
# [[[end]]]
directory = "docs/newsfragments"
filename = "CHANGELOG.md"
start_string = "<!-- towncrier release notes start -->\n"
underlines = ["", "", ""]
title_format = "## [{version}](https://github.com/OmniPotentRPC/rgpot/tree/v{version}) - {project_date}"
issue_format = "[#{issue}](https://github.com/OmniPotentRPC/rgpot/issues/{issue})"

[[tool.towncrier.type]]
directory = "breaking"
name = "Breaking"
showcontent = true

[[tool.towncrier.type]]
directory = "security"
name = "Security"
showcontent = true

[[tool.towncrier.type]]
directory = "removed"
name = "Removed"
showcontent = true

[[tool.towncrier.type]]
directory = "deprecated"
name = "Deprecated"
showcontent = true

[[tool.towncrier.type]]
directory = "added"
name = "Added"
showcontent = true

[[tool.towncrier.type]]
directory = "dev"
name = "Developer"
showcontent = true

[[tool.towncrier.type]]
directory = "changed"
name = "Changed"
showcontent = true

[[tool.towncrier.type]]
directory = "fixed"
name = "Fixed"
showcontent = true

[[tool.towncrier.type]]
directory   = "misc"
name        = "Miscellaneous"
showcontent = true
