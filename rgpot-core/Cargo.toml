[package]
name = "rgpot-core"
version = "3.1.2"
edition = "2021"
description = "Core Rust library for rgpot: RPC-based potential energy surface calculations"
license = "MIT"
repository = "https://github.com/OmniPotentRPC/rgpot"
documentation = "https://rgpot.rgoswami.me"
readme = "README.md"
keywords = ["potential-energy", "rpc", "molecular-dynamics", "dlpack", "ffi"]
categories = ["science", "api-bindings"]
exclude = ["Cargo.lock"]

[lib]
name = "rgpot_core"
crate-type = ["staticlib", "cdylib", "lib"]

[features]
default = []
schema = ["dep:capnp", "dep:capnpc"]
profile = ["schema", "dep:libloading"]
rpc = ["schema", "dep:capnp-rpc", "dep:tokio", "dep:tokio-util", "dep:futures"]
cache = []
gen-header = ["dep:cbindgen"]

[dependencies]
dlpk = { version = "0.1.5" }
# eindir-core as a unified Cargo crate (NOT a prebuilt static lib): rgpot_potential_t
# embeds eindir's repr(C) eindir_objective_t and resolves eindir_objective_* through
# this one shared crate. Sharing the crate (rlib) with downstream consumers such as
# anneal-core avoids the two-Rust-runtime conflict a separate libeindir_core.a causes.
eindir-core = { version = "0.5.0", features = ["capi"] }
capnp = { version = "0.20", features = ["unaligned"], optional = true }
libloading = { version = "0.8", optional = true }
capnp-rpc = { version = "0.20", optional = true }
tokio = { version = "1", features = ["rt", "rt-multi-thread", "net", "macros"], optional = true }
tokio-util = { version = "0.7", features = ["compat"], optional = true }
futures = { version = "0.3", optional = true }

[dev-dependencies]
ndarray = "0.17.2"

[[test]]
name = "profile"
path = "tests/profile.rs"
required-features = ["profile"]

[build-dependencies]
cbindgen = { version = "0.27", optional = true }
capnpc = { version = "0.20", optional = true }

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
