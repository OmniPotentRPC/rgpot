language = "C"
include_guard = "RGPOT_H"
header = """// MIT License
// Copyright 2023--present rgpot developers
//
// Auto-generated by cbindgen — do not edit manually.
"""
# dlpack.h declares DLManagedTensorVersioned as a bare struct; C needs the
# typedef to use the name the prototypes below spell.
after_includes = """#include <dlpack/dlpack.h>

#ifndef __cplusplus
typedef struct DLManagedTensorVersioned DLManagedTensorVersioned;
#endif"""
trailer = ""
include_version = true
autogen_warning = "/* Warning: this file is auto-generated by cbindgen. Do not modify this manually. */"
documentation = true
documentation_style = "doxy"

[defines]
"feature = rpc" = "RGPOT_HAS_RPC"

[export]
include = []
exclude = []

[export.rename]

[fn]
rename_args = "None"

[struct]
rename_fields = "None"

[enum]
rename_variants = "ScreamingSnakeCase"

[parse]
parse_deps = false
