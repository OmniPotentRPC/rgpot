[project]
name = "rgpot"
version = "3.0.2"
description = "Potential energy surfaces for atomistic simulation (LJ + Metatomic multi-ABI dlopen; nanobind abi3)"
readme = "README.md"
license = { text = "MIT" }
authors = [
  { name = "Rohit Goswami", email = "rgoswami@ieee.org" },
]
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.24",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: C++",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: Implementation :: CPython",
  "Topic :: Scientific/Engineering :: Chemistry",
  "Topic :: Scientific/Engineering :: Physics",
]
keywords = ["potential", "Lennard-Jones", "metatomic", "rgpot", "potlib", "dlopen", "nanobind", "abi3"]

[project.urls]
Homepage = "https://github.com/OmniPotentRPC/rgpot"
Repository = "https://github.com/OmniPotentRPC/rgpot"
Issues = "https://github.com/OmniPotentRPC/rgpot/issues"
Changelog = "https://github.com/OmniPotentRPC/rgpot/blob/main/CHANGELOG.md"

[project.optional-dependencies]
# Runtime Python stack for the Metatomic engine (torch + metatomic from PyPI).
# The engine .so is built into the wheel; these packages provide the NEEDED libs.
# Bundled multi-ABI engines cover torch 2.7+ (see README).
metatomic = [
  "torch>=2.7",
  "metatensor-core>=0.1.0",
  "metatensor-torch>=0.6.0",
  "metatomic-torch>=0.1.0",
  # 0.6+ VesinOptions (skin/n_threads); must match engine build headers.
  "vesin>=0.6.0",
]
ase = ["ase>=3.22"]
test = ["pytest>=7", "numpy>=1.24"]

[build-system]
requires = [
  "meson-python>=0.16",
  "meson>=1.3",
  "ninja",
  "nanobind>=2.2",
  "numpy>=1.24",
  # Build-time for libmetatomic_engine.so (same purelib layout at runtime).
  # Multi-ABI pack targets torch 2.7+; older majors are not shipped.
  "torch>=2.7",
  "metatensor-core",
  "metatensor-torch",
  "metatomic-torch",
  "vesin>=0.6.0",
]
build-backend = "mesonpy"

# The abi3 wheel tag is a declaration, not a detection: meson-python names
# the wheel abi3 only when this is set, no matter that the module builds as
# _core.abi3.so. Reverted automatically wherever the build passes
# -Dpython.allow_limited_api=false (the cp310/cp311 cibuildwheel override).
[tool.meson-python]
limited-api = true

# Wheel keeps dlopen Metatomic path: engine plugin + thin frontend (not LJ-only).
[tool.meson-python.args]
setup = [
  "-Dwith_python=true",
  "-Dwith_rpc=false",
  "-Dwith_rpc_client_only=false",
  "-Dwith_tests=false",
  "-Dwith_examples=false",
  # The eight Fortran 2018 kernels (SW, EDIP, Lenosky, Tersoff, EAM-Al,
  # FeHe, CuH2, TIP4P-H). Without this the wheel ships a librgpot with no
  # Fortran-backed potentials at all -- the pots this library exists to
  # host. Needs a Fortran compiler in the wheel build environment; the
  # repair step vendors libgfortran into the wheel like any other
  # dependency.
  "-Dwith_fortran_pots=enabled",
  "-Dwith_metatomic=true",
  "-Dwith_xtb=false",
  "-Dwith_xckernel=false",
  "-Dwith_dftd3=false",
  "-Dwith_dftd4=false",
  "-Dwith_tblite=false",
  "-Dwith_rust_core=false",
  "-Dwith_cache=false",
  "-Dwith_eigen=false",
  "-Db_lto=false",
]
install = ["--skip-subprojects"]
dist = ["--include-subprojects"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]

[tool.cibuildwheel]
# manylinux images carry gcc/g++ but not gfortran, and the Fortran kernels
# are part of the library's point.
build-frontend = "build"
# cp312 is the stable-ABI build: meson gates Py_LIMITED_API on build
# Python >= 3.12, and tool.meson-python.limited-api turns that into a
# cp312-abi3 tag covering every 3.12+ CPython. cp310/cp311 build native
# wheels with the limited API switched off via the override below.
build = "cp310-* cp311-* cp312-*"
skip = ["pp*", "*-musllinux*", "*_i686", "*-win32"]
# Prove the kernels are in the artifact rather than trusting the flag: a
# wheel whose librgpot has no bind(c) entry points is the bug 3.0.1 fixed.
test-command = "python -c \"import rgpot; print(rgpot.__file__)\""

# meson skips the limited_api kwarg under these interpreters anyway; the
# explicit -D flag makes meson-python drop the abi3 tag to match.
[[tool.cibuildwheel.overrides]]
select = "cp310-* cp311-*"
config-settings = "setup-args=-Dpython.allow_limited_api=false"

[tool.cibuildwheel.linux]
before-all = "yum install -y gcc-gfortran || dnf install -y gcc-gfortran"
# meson-python vendors librgpot into .rgpot.mesonpy.libs and rewrites RPATHs,
# but auditwheel still resolves NEEDED against the filesystem. Unpack the
# wheel and put that directory on LD_LIBRARY_PATH.
#
# Torch / metatomic / metatensor are runtime deps of the Metatomic engine
# plugin (dlopen / RPATH). Do not vendor them into the wheel — exclude so
# auditwheel leaves those NEEDED entries for the installed torch stack.
repair-wheel-command = """
  set -eu
  # mesonpy zip drops ELF soversion links; _core NEEDs librgpot.so.3.
  bash scripts/rgpot_repair_wheel.sh "{wheel}"
  tmp=$(mktemp -d)
  unzip -q "{wheel}" -d "$tmp"
  libdir=$(dirname "$(find "$tmp" -name 'librgpot.so.3' | head -1)")
  test -n "$libdir"
  LD_LIBRARY_PATH="$libdir:${LD_LIBRARY_PATH:-}" \
    auditwheel repair -w {dest_dir} "{wheel}" \
      --exclude libtorch.so \
      --exclude libtorch_cpu.so \
      --exclude libc10.so \
      --exclude libtorch_python.so \
      --exclude libmetatensor_torch.so \
      --exclude libmetatomic_torch.so \
      --exclude libmetatensor.so \
      --exclude libgomp.so.1
  rm -rf "$tmp"
"""

[tool.cibuildwheel.macos]
# The brew gcc gfortran runtime (libgfortran/libquadmath) is built for
# macOS 14; delocate refuses to stamp an 11.0 wheel around it.
environment = { MACOSX_DEPLOYMENT_TARGET = "14.0" }
before-all = "brew list gcc >/dev/null 2>&1 || brew install gcc"
# Same librgpot search-path story as Linux. Exclude torch/metatomic dylibs:
# they ship with the pip torch / metatomic-torch wheels, not inside rgpot.
repair-wheel-command = """
  set -eu
  tmp=$(mktemp -d)
  unzip -q "{wheel}" -d "$tmp"
  libdir=$(dirname "$(find "$tmp" -name 'librgpot*.dylib' | head -1)")
  DYLD_LIBRARY_PATH="$libdir:${DYLD_LIBRARY_PATH:-}" \
    delocate-wheel --require-archs {delocate_archs} -w {dest_dir} -v "{wheel}" \
      --ignore-missing-dependencies \
      --exclude libtorch \
      --exclude libtorch_cpu \
      --exclude libc10 \
      --exclude libtorch_python \
      --exclude libmetatensor_torch \
      --exclude libmetatomic_torch \
      --exclude libmetatensor
  rm -rf "$tmp"
"""
