# An above-baseline instruction in librgpot or _core is a violation
# unless an [[allow]] names that symbol.
#
# Highway target("fma") bodies and the target("avx2") Lennard-Jones
# cluster kernel are entered only after a runtime check. The FMA fold
# and the fixed-sequence exp clones are entered only after
# fma_hw_active() or the CPU check of function multiversioning.
# Vendored entries cover libraries that auditwheel or delocate copy into
# the wheel and that select kernels at run time. A feature not listed
# here still fails the audit.

baseline = "x86-64"

[[allow]]
symbol = "^rgpot::simd::(?:accept_row_hw|eam_fma|eam_hw|exact_fma_hw|exp2_hw|exp_hw_n|lj_hw|morse8_hw|morse_hw|r2_hw_n|r2_hw)(?:\\(|$)"
features = ["avx", "fma"]
reason = "target(\"fma\") bodies, entered only after glibc_fma_active()"

[[allow]]
symbol = "^rgpot::(?:_GLOBAL__N_[0-9]+::|\\(anonymous namespace\\)::)(?:lj_avx2|eval_quad|acc_quad)(?:\\(|$)"
features = ["avx", "avx2"]
reason = "target(\"avx2\") LJ cluster bodies, entered only after __builtin_cpu_supports(\"avx2\")"

[[allow]]
symbol = "^__cpu_indicator_init(?:\\(|$)"
features = ["xsave"]
reason = "GCC __builtin_cpu_supports initializer; xgetbv reads XCR0"

[[vendored]]
path = ".*libopenblas.*"
features = [
  "sse3",
  "ssse3",
  "sse4_1",
  "sse4_2",
  "popcnt",
  "avx",
  "avx2",
  "fma",
  "f16c",
  "bmi1",
  "bmi2",
  "lzcnt",
  "avx512f",
  "avx512vl",
  "avx512dq",
  "avx512bw",
  "avx512cd",
  "avx512_vnni",
  "avx512_bf16",
  "avx512_vpopcntdq",
  "avx512_ifma",
  "avx512_vbmi",
  "avx512_vbmi2",
  "fma4",
  "xop",
  "sse4a",
  "prefetchw",
  "d3now",
  "xsave",
  "lse",
  "dotprod",
  "i8mm",
  "bf16",
  "fcma",
  "sve",
  "sve2",
  "sme",
  "crc32",
  "aes",
  "sha1",
  "sha2",
  "pmull",
  "fp16",
  "rdm",
  "rcpc",
]
reason = "DYNAMIC_ARCH"

[[vendored]]
path = ".*libgfortran.*"
features = [
  "sse3",
  "ssse3",
  "sse4_1",
  "sse4_2",
  "popcnt",
  "avx",
  "avx2",
  "fma",
