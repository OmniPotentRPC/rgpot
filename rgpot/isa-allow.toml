# Above-baseline instructions in librgpot belong to the [[allow]] symbols.
# Those bodies run only after a runtime check. The vendored entries cover
# libraries that auditwheel or delocate copy into the wheel and that select
# kernels at run time. A feature not listed here still fails the audit.

baseline = "x86-64"

[[vendored]]
path = ".*libopenblas.*"
features = [
  "sse3",
  "ssse3",
  "sse4_1",
  "sse4_2",
  "popcnt",
  "avx",
  "avx2",
  "fma",
  "f16c",
  "bmi1",
  "bmi2",
  "lzcnt",
  "avx512f",
  "avx512vl",
  "avx512dq",
  "avx512bw",
  "avx512cd",
  "avx512_vnni",
  "avx512_bf16",
  "avx512_vpopcntdq",
  "avx512_ifma",
  "avx512_vbmi",
  "avx512_vbmi2",
  "fma4",
  "xop",
  "sse4a",
  "prefetchw",
  "d3now",
  "xsave",
  "lse",
  "dotprod",
  "i8mm",
  "bf16",
  "fcma",
  "sve",
  "sve2",
  "sme",
  "crc32",
  "aes",
  "sha1",
  "sha2",
  "pmull",
  "fp16",
  "rdm",
  "rcpc",
]
reason = "DYNAMIC_ARCH"

[[vendored]]
path = ".*libgfortran.*"
features = [
  "sse3",
  "ssse3",
  "sse4_1",
  "sse4_2",
  "popcnt",
  "avx",
  "avx2",
  "fma",
  "avx512f",
  "avx512vl",
  "avx512dq",
  "avx512bw",
  "fma4",
  "xsave",
  "lse",
  "dotprod",
  "sve",
  "sve2",
  "fp16",
  "rcpc",
]
reason = "gfortran matmul runtime variants"

[[vendored]]
path = ".*libgomp.*"
features = [
  "sse3",
  "ssse3",
  "sse4_1",
  "sse4_2",
  "popcnt",
  "avx",
  "avx2",
  "fma",
  "rtm",
  "hle",
  "xsave",
  "lse",
]
reason = "libgomp runtime"

[[vendored]]
path = ".*libquadmath.*"
features = [
  "sse3",
  "ssse3",
  "sse4_1",
  "sse4_2",
  "popcnt",
  "avx",
  "avx2",
  "fma",
  "bmi1",
  "bmi2",
  "lzcnt",
  "xsave",
]
reason = "libquadmath, vendored beside libgfortran"

# FMA bodies outside a dispatched namespace. Each one is entered only after
# simd::detail::fma_hw_active() finds a usable FMA. The portable path stays
# free of these instructions. accumulateHw is the target("fma") pair-list
# loop; -mfma also selects AVX encodings in that body.
[[allow]]
symbol = '^(rgpot::simd::exact_fma_hw|rgpot::nlist::_GLOBAL__N_[0-9]+::fold_hardware)\b|rgpot::nlist::CachedPairList::accumulateHw<'
features = ["avx", "fma", "sse3"]
reason = "FMA bodies selected when the processor's FMA is usable"

# Vector-width clones (target_clones) of loops that use no FMA. The loader
# picks a clone from libgcc's own CPU check; each clone returns the bits of
# the baseline one.
[[allow]]
symbol = '^rgpot::(simd::exp_fixed_n|detail::morse_row)\(.*\) \[clone \.(avx2|avx512f)[^\]]*\]|^_ZN5rgpot(4simd11exp_fixed_n|6detail9morse_row)E\S*\.(avx2|avx512f)$'
features = ["avx", "avx2", "avx512f", "sse3", "ssse3", "sse4_1", "sse4_2", "popcnt"]
reason = "vector-width clones selected by the CPU check of function multiversioning"

# The FMA probe reads XCR0 after CPUID reports OSXSAVE.
[[allow]]
symbol = '^rgpot::simd::detail::cpuid_fma_usable\(\)$'
features = ["xsave"]
reason = "xgetbv in the CPUID probe, run after the OSXSAVE bit"
