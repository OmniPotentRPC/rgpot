# An above-baseline instruction in librgpot or _core is a violation
# unless an [[allow]] names that symbol. The first symbol rule is the
# target("fma") bodies in CppCore/rgpot/simd/exp.cc. That attribute also
# emits AVX encodings (vmovsd, vmovapd) for ordinary moves, because the
# fused instruction is VEX-encoded. Each body is entered only after
# detail::glibc_fma_active(), which reads glibc's usable FMA bit and
# therefore follows the hwcaps tunable. The baseline caller stays on
# SSE2 or the Dekker product. The second rule is the target("avx2")
# Lennard-Jones cluster bodies in LJClusterKernel.cc. lj_cluster_direct
# calls lj_avx2 only after __builtin_cpu_supports("avx2"); eval_quad and
# acc_quad are the helpers that body inlines or calls. The third rule is
# GCC's __cpu_indicator_init, which that builtin uses to read XCR0 with
# xgetbv. Vendored entries cover libraries that auditwheel or delocate
# copy into the wheel and that select kernels at run time. A feature
# not listed here still fails the audit.

baseline = "x86-64"

[[allow]]
symbol = "^rgpot::simd::(?:accept_row_hw|eam_fma|eam_hw|exact_fma_hw|exp2_hw|exp_hw_n|lj_hw|morse8_hw|morse_hw|r2_hw_n|r2_hw)(?:\\(|$)"
features = ["avx", "fma"]
reason = "target(\"fma\") bodies, entered only after glibc_fma_active()"

[[allow]]
symbol = "^rgpot::(?:_GLOBAL__N_[0-9]+::|\\(anonymous namespace\\)::)(?:lj_avx2|eval_quad|acc_quad)(?:\\(|$)"
features = ["avx", "avx2"]
reason = "target(\"avx2\") LJ cluster bodies, entered only after __builtin_cpu_supports(\"avx2\")"

[[allow]]
symbol = "^__cpu_indicator_init(?:\\(|$)"
features = ["xsave"]
reason = "GCC __builtin_cpu_supports initializer; xgetbv reads XCR0"

